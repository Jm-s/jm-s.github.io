<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-label="MRI: define the clinical question"><rect width="1000" height="390" fill="#f2f6fa"/><text x="45" y="65" font-family="Arial,sans-serif" font-size="30" fill="#153348">MRI: define the clinical question</text><rect x="45" y="95" width="910" height="62" rx="8" fill="white"/><text x="65" y="134" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#147d85">DIAGNOSIS</text><text x="260" y="134" font-family="Arial,sans-serif" font-size="22" fill="#153348">What supports the diagnosis?</text><rect x="45" y="171" width="910" height="62" rx="8" fill="white"/><text x="65" y="210" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#147d85">ATTACK</text><text x="260" y="210" font-family="Arial,sans-serif" font-size="22" fill="#153348">What explains new symptoms?</text><rect x="45" y="247" width="910" height="62" rx="8" fill="white"/><text x="65" y="286" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#147d85">RECOVERY</text><text x="260" y="286" font-family="Arial,sans-serif" font-size="22" fill="#153348">What changed after the attack?</text><text x="45" y="362" font-family="Arial,sans-serif" font-size="16" fill="#536573">Conceptual summary • Reading questions, not a validated clinical algorithm</text></svg>